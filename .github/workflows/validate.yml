name: validate

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Structural check first, so a syntax error is reported even if the
      # Claude Code step cannot run.
      - name: Check JSON syntax
        run: |
          for f in .claude-plugin/marketplace.json plugins/*/.claude-plugin/plugin.json; do
            python3 -m json.tool "$f" > /dev/null && echo "ok: $f"
          done

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install Claude Code
        run: npm install -g @anthropic-ai/claude-code

      - name: Validate marketplace
        run: claude plugin validate .
